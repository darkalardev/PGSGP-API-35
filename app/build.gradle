plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "io.cgisca.godot.gpgs"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        def libName = project.findProperty("library_name") ?: "GodotPlayGamesServices"
        buildConfigField "String", "LIBRARY_NAME", "\"${libName}\""

        consumerProguardFiles "consumer-rules.pro"
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        viewBinding true
        buildConfig  true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "com.google.android.gms:play-services-games:23.2.0"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.code.gson:gson:2.10"

    implementation files("../godot-lib.release/godot-lib.4.5.beta5.template_release.aar")

    testImplementation "junit:junit:4.13.2"
}
